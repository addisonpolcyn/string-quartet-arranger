[project]
name = "pop2quartet"
version = "0.1.0"
description = "Convert pop songs into string quartet arrangements"
requires-python = ">=3.11"
dependencies = [
    "basic-pitch>=0.4.0",
    "demucs>=4.1.0",
    "librosa>=0.11.0",
    "music21>=10.5.1",
    "numpy<2",
    "pretty-midi>=0.2.11.post0",
    "soundfile>=0.14.0",
]

[project.scripts]
pop2quartet = "pop2quartet.__main__:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
